<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Varaq</title><!-- replaced from STRINGS when the page starts -->
  <meta name="theme-color" content="#12151b">

  <!-- Web fonts are optional: if they fail to load (offline), the fallback stacks below are used. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       THEMES
       Every colour in the app comes from these variables, so a
       new theme is just one more block of variables.
       ========================================================= */
    :root {
      --font-serif: "Lora", Georgia, "Times New Roman", serif;
      --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius-card: 14px;
      --radius-control: 10px;
      --radius-dialog: 20px;
      --ease: cubic-bezier(0.2, 0.7, 0.3, 1);
    }

    /* Dark (default): a blue-black "night reading" page with a lamp-light accent */
    :root,
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #12151b;
      --surface: #181c23;
      --surface-2: #1f242d;
      --text: #e9e4d8;
      --text-muted: #a3a097;
      --border: #2c323d;
      --accent: #dfb37a;
      --accent-ink: #1c1509;
      --danger: #f0a0a0;
      --focus: #ecc590;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 24px rgba(0, 0, 0, 0.22);
    }

    /* Sepia: old paper with fountain-pen blue ink */
    :root[data-theme="sepia"] {
      color-scheme: light;
      --bg: #ece0c8;
      --surface: #f5ecd9;
      --surface-2: #e6d8bc;
      --text: #3a2f23;
      --text-muted: #6a5a46;
      --border: #d5c5a4;
      --accent: #2f4f6f;
      --accent-ink: #f8f1e2;
      --danger: #a4322a;
      --focus: #2f4f6f;
      --shadow: 0 1px 2px rgba(80, 55, 20, 0.08), 0 8px 24px rgba(80, 55, 20, 0.1);
    }

    /* Light: cool white paper with a claret bookmark-ribbon accent */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f3f4f6;
      --surface: #ffffff;
      --surface-2: #eceef1;
      --text: #1f2328;
      --text-muted: #5d646c;
      --border: #dde1e6;
      --accent: #8a2f3f;
      --accent-ink: #ffffff;
      --danger: #b3312b;
      --focus: #8a2f3f;
      --shadow: 0 1px 2px rgba(20, 30, 50, 0.06), 0 8px 24px rgba(20, 30, 50, 0.07);
    }

    /* =========================================================
       BASE
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-ui);
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s var(--ease), color 0.3s var(--ease);
    }

    /* Stop the page behind an open dialog from scrolling */
    body:has(dialog[open]) { overflow: hidden; }

    h1, h2, p, blockquote, ul { margin: 0; }
    ul { padding: 0; list-style: none; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }

    /* The hidden attribute must always win over display rules below */
    [hidden] { display: none !important; }

    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .container { width: min(100% - 2rem, 62rem); margin-inline: auto; }

    /* Icons are inline SVGs sized in em, so they follow the text size around them */
    .icon { display: inline-flex; flex: none; }
    .icon svg { width: 1.25em; height: 1.25em; }

    /* =========================================================
       HEADER + THEME SWITCH
       ========================================================= */
    .site-header { padding: 1.25rem 0 0.5rem; }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-ink);
    }
    .brand-mark svg { width: 1.3rem; height: 1.3rem; }

    .brand-name {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.1;
    }
    .brand-tagline { font-size: 0.8125rem; color: var(--text-muted); }

    .theme-switch {
      display: flex;
      gap: 0.5rem;
      padding: 0.375rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
    }

    .theme-btn {
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 0;
      border-radius: 50%;
      /* Each swatch is a circle split in two: page colour + accent colour */
      background: linear-gradient(135deg, var(--sw-page) 50%, var(--sw-accent) 50%);
      box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.4);
      transition: box-shadow 0.2s var(--ease);
    }
    .theme-btn[aria-pressed="true"] {
      box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent);
    }
    .theme-btn[data-theme-option="dark"]  { --sw-page: #12151b; --sw-accent: #dfb37a; }
    .theme-btn[data-theme-option="sepia"] { --sw-page: #ece0c8; --sw-accent: #2f4f6f; }
    .theme-btn[data-theme-option="light"] { --sw-page: #ffffff; --sw-accent: #8a2f3f; }

    /* =========================================================
       QUOTE OF THE DAY
       The one "memorable" element: a page with a ribbon bookmark.
       ========================================================= */
    .daily {
      position: relative;
      margin-top: 1rem;
      padding: 1.5rem 1.5rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    /* The ribbon hangs from the top edge of the page */
    .daily::after {
      content: "";
      position: absolute;
      top: -1px;
      right: 1.5rem;
      width: 1.6rem;
      height: 3rem;
      background: var(--accent);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 78%, 0 100%);
    }

    .daily-label { font-size: 0.9375rem; font-weight: 600; color: var(--accent); padding-right: 3rem; }

    .daily-text {
      max-width: 42rem;
      margin-top: 1rem;
      font-family: var(--font-serif);
      font-size: clamp(1.3rem, 1.05rem + 1.4vw, 1.85rem);
      line-height: 1.5;
      white-space: pre-line; /* keeps the line breaks the user typed */
      text-wrap: pretty;
    }

    .daily-source { margin-top: 1rem; }
    .daily .btn { margin-top: 1.25rem; }

    .source-author { display: block; font-weight: 600; }
    .source-book { display: block; color: var(--text-muted); font-size: 0.9375rem; }
    .source-book cite { font-style: italic; }

    /* =========================================================
       SEARCH + FILTERS
       ========================================================= */
    .toolbar { display: grid; gap: 0.75rem; margin-top: 1.75rem; }

    .control {
      width: 100%;
      min-height: 2.75rem;
      padding: 0.6rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.15s, background-color 0.3s;
    }
    .control::placeholder { color: var(--text-muted); opacity: 1; }
    .control[aria-invalid="true"] { border-color: var(--danger); }

    .search { position: relative; }
    .search .control { padding-left: 2.6rem; }
    .search-icon {
      position: absolute;
      top: 0; bottom: 0; left: 0.9rem;
      align-items: center;
      color: var(--text-muted);
      pointer-events: none;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
      align-items: end;
    }

    .field { display: grid; gap: 0.35rem; min-width: 0; }
    .field > label { font-size: 0.8125rem; font-weight: 600; color: var(--text-muted); }

    /* "Favorites only" is a real checkbox, styled as a toggle button */
    .chip-toggle { position: relative; grid-column: 1 / -1; }
    .chip-toggle .chip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 2.75rem;
      padding: 0.6rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      background: var(--surface);
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }
    .chip-toggle input:checked + .chip {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    .chip-toggle input:checked + .chip svg { fill: currentColor; }
    .chip-toggle input:focus-visible + .chip { outline: 3px solid var(--focus); outline-offset: 2px; }

    @media (min-width: 720px) {
      .filters { grid-template-columns: repeat(3, minmax(0, 1fr)) auto; }
      .chip-toggle { grid-column: auto; }
    }

    .results-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-height: 1.5rem;
      margin: 1.25rem 0 0.75rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .link-btn {
      padding: 0.25rem 0.5rem;
      border: 0;
      border-radius: 6px;
      background: none;
      color: var(--accent);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* =========================================================
       QUOTE CARDS
       ========================================================= */
    .quote-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr));
      gap: 1rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1.25rem 1.25rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-text {
      font-family: var(--font-serif);
      font-size: 1.1875rem;
      line-height: 1.65;
      white-space: pre-line;
      overflow-wrap: anywhere;
      text-wrap: pretty;
    }
    /* A large opening quote mark, drawn with CSS so it never touches the saved text */
    .card-text::before {
      content: "\201C";
      display: block;
      height: 1.5rem;
      font-size: 3rem;
      line-height: 1;
      color: var(--accent);
    }

    .card-note {
      padding-left: 0.85rem;
      border-left: 3px solid var(--accent);
      font-size: 0.9375rem;
      color: var(--text-muted);
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .tag {
      padding: 0.25rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 0.8125rem;
      transition: color 0.15s, border-color 0.15s;
    }
    .tag:hover { color: var(--text); border-color: var(--accent); }
    .tag[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

    .card-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0 0.75rem;
      margin-top: auto; /* pushes the footer to the bottom when neighbours are taller */
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }
    .card-date { font-size: 0.8125rem; color: var(--text-muted); }
    .card-actions { display: flex; gap: 0.125rem; margin-left: auto; }

    .icon-btn {
      display: inline-grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
      padding: 0;
      border: 0;
      border-radius: var(--radius-control);
      background: transparent;
      color: var(--text-muted);
      transition: background-color 0.15s, color 0.15s, transform 0.15s;
    }
    .icon-btn svg { width: 1.2rem; height: 1.2rem; }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn[aria-pressed="true"] { color: var(--accent); }
    .icon-btn[aria-pressed="true"] svg { fill: currentColor; }
    .icon-btn.danger:hover { color: var(--danger); }

    /* Empty state and "nothing found" share this layout */
    .empty {
      grid-column: 1 / -1;
      display: grid;
      justify-items: center;
      gap: 0.75rem;
      padding: 3.5rem 1.5rem;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-card);
      text-align: center;
    }
    .empty .icon { color: var(--accent); }
    .empty .icon svg { width: 3.5rem; height: 3.5rem; stroke-width: 1.5; }
    .empty h2 { font-family: var(--font-serif); font-size: 1.5rem; }
    .empty p { max-width: 30rem; color: var(--text-muted); }
    .empty .btn { margin-top: 0.5rem; }

    /* =========================================================
       BUTTONS
       ========================================================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 2.75rem;
      padding: 0.6rem 1.15rem;
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      font-weight: 600;
      transition: background-color 0.15s, filter 0.15s, transform 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text); }
    .btn-ghost:hover { background: var(--surface-2); }

    /* The "new quote" button floats: icon-only on phones, icon + label on wider screens */
    .fab {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right));
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 20;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-width: 3.5rem;
      height: 3.5rem;
      padding: 0 1rem;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      transition: filter 0.15s, transform 0.15s;
    }
    .fab:hover { filter: brightness(1.08); }
    .fab:active { transform: scale(0.96); }
    .fab .icon svg { width: 1.5rem; height: 1.5rem; }
    .fab-label { display: none; }

    @media (min-width: 640px) {
      .fab { right: 1.5rem; bottom: 1.5rem; padding: 0 1.4rem 0 1.15rem; }
      .fab-label { display: inline; }
    }

    /* =========================================================
       DIALOG (add / edit)
       ========================================================= */
    dialog {
      width: min(100% - 1.5rem, 34rem);
      max-height: calc(100vh - 1.5rem);
      max-height: calc(100dvh - 1.5rem);
      padding: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-dialog);
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
      overflow: auto;
    }
    dialog::backdrop { background: rgba(8, 10, 14, 0.6); backdrop-filter: blur(3px); }
    dialog[open] { animation: dialog-in 0.22s var(--ease); }
    @keyframes dialog-in {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1.1rem 1.25rem 0.25rem;
    }
    .dialog-head h2 { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 600; }
    .dialog-body { display: grid; gap: 1rem; padding: 0.75rem 1.25rem 1rem; }
    .dialog-foot { display: flex; justify-content: flex-end; gap: 0.75rem; padding: 0.5rem 1.25rem 1.25rem; }

    .field-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 0.75rem; }
    .dialog-body .field > label { color: var(--text); }
    .req { color: var(--accent); }
    .field-error { font-size: 0.875rem; color: var(--danger); }

    textarea.control { resize: vertical; line-height: 1.5; }
    #field-text { min-height: 8rem; font-family: var(--font-serif); font-size: 1.0625rem; line-height: 1.6; }
    #field-note { min-height: 4.5rem; }

    /* =========================================================
       TOASTS (messages + "Undo")
       ========================================================= */
    .toasts {
      position: fixed;
      left: 1rem;
      right: 1rem;
      bottom: calc(5.25rem + env(safe-area-inset-bottom)); /* sits above the round button on phones */
      z-index: 40;
      display: grid;
      gap: 0.5rem;
      justify-items: center;
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 1rem;
      max-width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 12px;
      background: var(--text);
      color: var(--bg);
      font-size: 0.9375rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      pointer-events: auto;
      animation: toast-in 0.25s var(--ease);
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    .toast-action {
      margin: -0.4rem -0.5rem -0.4rem 0;
      padding: 0.4rem 0.5rem;
      border: 0;
      border-radius: 8px;
      background: none;
      color: inherit;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    @media (min-width: 640px) {
      .toasts { left: 1.5rem; right: auto; bottom: 1.5rem; max-width: 26rem; justify-items: start; }
    }

    /* =========================================================
       FOOTER (backup + shortcuts)
       ========================================================= */
    .site-footer {
      display: grid;
      gap: 0.75rem;
      margin-top: 3rem;
      padding-block: 1.75rem 6rem; /* extra room so the round button never covers the text */
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.9375rem;
    }
    .site-footer h2 { font-family: var(--font-serif); font-size: 1.0625rem; color: var(--text); }
    .site-footer p { max-width: 40rem; }
    .footer-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .shortcuts { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; font-size: 0.8125rem; }
    kbd {
      margin-right: 0.4rem;
      padding: 0.1rem 0.45rem;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 0.75rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 479px) {
      .brand-tagline { display: none; }
    }

    /* =========================================================
       MAIN NAVIGATION (Quotes / Reader)
       ========================================================= */
    .main-nav-wrap { margin-top: 0.75rem; }

    .main-nav {
      display: inline-flex;
      gap: 0.25rem;
      padding: 0.25rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 2.5rem;
      padding: 0.4rem 1.1rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      transition: background-color 0.15s, color 0.15s;
    }
    .nav-btn:hover { color: var(--text); }
    .nav-btn[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

    /* =========================================================
       READER: HOME (no book open)
       ========================================================= */
    .reader { margin-top: 1.25rem; }
    .reader-home { display: grid; gap: 2rem; }

    .drop-zone {
      display: grid;
      justify-items: center;
      gap: 0.75rem;
      padding: 3rem 1.5rem;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-card);
      text-align: center;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .drop-zone.is-dragging { border-color: var(--accent); background: var(--surface); }
    .drop-zone > .icon { color: var(--accent); }
    .drop-zone > .icon svg { width: 3.5rem; height: 3.5rem; stroke-width: 1.5; }
    .drop-zone h2 { font-family: var(--font-serif); font-size: 1.5rem; }
    .drop-zone p { max-width: 30rem; color: var(--text-muted); }
    .drop-hint { font-size: 0.875rem; }
    .reader-status { min-height: 1.5rem; font-size: 0.9375rem; }

    .recent h2 { font-family: var(--font-serif); font-size: 1.25rem; }
    .recent-hint { margin: 0.25rem 0 1rem; max-width: 40rem; font-size: 0.9375rem; color: var(--text-muted); }
    .recent-list { display: grid; gap: 0.75rem; }

    .recent-item {
      display: flex;
      align-items: stretch;
      gap: 0.25rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .recent-open {
      flex: 1;
      display: grid;
      gap: 0.1rem;
      min-width: 0;
      padding: 0.9rem 1rem;
      border: 0;
      border-radius: var(--radius-card);
      background: none;
      text-align: left;
    }
    .recent-open:hover { background: var(--surface-2); }
    .recent-title { font-family: var(--font-serif); font-size: 1.125rem; overflow-wrap: anywhere; }
    .recent-author, .recent-page { font-size: 0.875rem; color: var(--text-muted); }
    .recent-item .icon-btn { align-self: center; margin-right: 0.5rem; }

    /* =========================================================
       READER: BOOK (toolbar + page)
       ========================================================= */
    .book-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.25rem 1rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .book-head { flex: 1 1 14rem; display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
    .book-title {
      font-family: var(--font-serif);
      font-size: 1.125rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .book-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1rem; }
    .ctrl-group { display: flex; align-items: center; gap: 0.25rem; }
    .ctrl-group > .icon { color: var(--text-muted); }

    .page-input { width: 4.25rem; min-height: 2.5rem; padding: 0.35rem 0.4rem; text-align: center; -moz-appearance: textfield; }
    .page-input::-webkit-outer-spin-button, .page-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .page-total { min-width: 3rem; font-size: 0.9375rem; color: var(--text-muted); }

    .text-btn {
      min-width: 3.5rem;
      min-height: 2.5rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      background: transparent;
      font-size: 0.875rem;
      font-weight: 600;
      transition: background-color 0.15s;
    }
    .text-btn:hover { background: var(--surface-2); }

    .range { width: 6.5rem; accent-color: var(--accent); }

    /* On wider screens the toolbar stays visible while you scroll down a tall page */
    @media (min-width: 720px) {
      .book-bar { position: sticky; top: 0.5rem; z-index: 15; }
    }

    /* The page colours: the PDF is drawn on a white canvas, and a CSS filter recolours it.
       "Dark" inverts it (keeping hues roughly right), "sepia" warms it up.
       brightness(1) is the "do nothing" filter: a plain "none" can't be combined with others. */
    :root { --page-filter: brightness(1); }
    :root[data-theme="dark"] { --page-filter: invert(0.9) hue-rotate(180deg); }
    :root[data-theme="sepia"] { --page-filter: sepia(0.45); }

    .page-scroller { margin-top: 1rem; padding: 4px 4px 2rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .page-stage { width: max-content; min-width: 100%; }
    .page {
      position: relative;
      margin-inline: auto;
      border-radius: 4px;
      background: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .page canvas {
      display: block;
      filter: var(--page-filter) brightness(var(--page-brightness, 1));
      transition: filter 0.3s var(--ease);
    }

    /* The invisible text on top of the canvas: it makes text selectable and searchable */
    .textLayer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      line-height: 1;
      text-align: initial;
      transform-origin: 0 0;
      -webkit-text-size-adjust: none;
      text-size-adjust: none;
      -webkit-user-select: text;
      user-select: text;
    }
    .textLayer span, .textLayer br {
      position: absolute;
      color: transparent;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    .textLayer span.markedContent { top: 0; height: 0; } /* wrapper spans must not shift the words inside them */
    .textLayer ::selection { background: rgba(79, 140, 255, 0.4); }
    .textLayer br::selection { background: transparent; } /* avoids odd highlighted bars in Chrome */
    /* Keeps a drag-selection from jumping to far-away text when the mouse leaves the lines */
    .textLayer .endOfContent {
      display: block;
      position: absolute;
      inset: 100% 0 0;
      z-index: -1;
      cursor: default;
      -webkit-user-select: none;
      user-select: none;
    }
    .textLayer.selecting .endOfContent { top: 0; }

    .page-nav-bottom { display: flex; justify-content: space-between; gap: 1rem; margin-top: 0.5rem; }

    .selection-bar {
      position: fixed;
      left: 50%;
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 30;
      transform: translateX(-50%);
      animation: toast-in 0.2s var(--ease);
    }
    .selection-bar .btn { box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35); }

  </style>
</head>

<body>
  <!--
    The HTML below contains no visible text of its own.
    Elements marked data-i18n / data-i18n-placeholder / data-i18n-label get their
    text from the STRINGS object in the script, and data-icon gets an icon from ICONS.
  -->

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <span class="brand-mark" data-icon="bookmark"></span>
        <div>
          <h1 class="brand-name" data-i18n="appName"></h1>
          <p class="brand-tagline" data-i18n="tagline"></p>
        </div>
      </div>

      <div class="theme-switch" role="group" data-i18n-label="themeLabel">
        <button type="button" class="theme-btn" data-theme-option="dark"  data-i18n-label="themeDark"  aria-pressed="false"></button>
        <button type="button" class="theme-btn" data-theme-option="sepia" data-i18n-label="themeSepia" aria-pressed="false"></button>
        <button type="button" class="theme-btn" data-theme-option="light" data-i18n-label="themeLight" aria-pressed="false"></button>
      </div>
    </div>

    <nav class="container main-nav-wrap" data-i18n-label="navLabel">
      <div class="main-nav">
        <button type="button" class="nav-btn" data-view="quotes" aria-current="page">
          <span data-icon="bookmark"></span><span data-i18n="navQuotes"></span>
        </button>
        <button type="button" class="nav-btn" data-view="reader">
          <span data-icon="book"></span><span data-i18n="navReader"></span>
        </button>
      </div>
    </nav>
  </header>

  <main class="container" id="view-quotes">
    <!-- Quote of the day (hidden until there is at least one quote) -->
    <section class="daily" id="daily" aria-labelledby="daily-title" hidden>
      <h2 class="daily-label" id="daily-title" data-i18n="quoteOfDay"></h2>
      <blockquote class="daily-text" id="daily-text"></blockquote>
      <div class="daily-source" id="daily-source"></div>
      <button type="button" class="btn btn-ghost" id="another-btn">
        <span data-icon="refresh"></span>
        <span data-i18n="anotherOne"></span>
      </button>
    </section>

    <!-- Search + filters (hidden while there are no quotes) -->
    <section class="toolbar" id="toolbar">
      <div class="search">
        <label class="sr-only" for="search-input" data-i18n="searchLabel"></label>
        <span class="search-icon icon" data-icon="search"></span>
        <input class="control" type="search" id="search-input" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
      </div>

      <div class="filters">
        <div class="field">
          <label for="filter-book" data-i18n="filterBook"></label>
          <select class="control" id="filter-book"></select>
        </div>
        <div class="field">
          <label for="filter-tag" data-i18n="filterTag"></label>
          <select class="control" id="filter-tag"></select>
        </div>
        <div class="field">
          <label for="sort-select" data-i18n="sortLabel"></label>
          <select class="control" id="sort-select">
            <option value="newest" data-i18n="sortNewest"></option>
            <option value="oldest" data-i18n="sortOldest"></option>
          </select>
        </div>
        <label class="chip-toggle">
          <input class="sr-only" type="checkbox" id="filter-favorites">
          <span class="chip">
            <span data-icon="heart"></span>
            <span data-i18n="onlyFavorites"></span>
          </span>
        </label>
      </div>
    </section>

    <div class="results-meta" id="results-meta">
      <p id="results-count" aria-live="polite"></p>
      <button type="button" class="link-btn" id="clear-filters-btn" data-i18n="clearFilters" hidden></button>
    </div>

    <!-- Cards, the empty state and the "nothing found" state are all drawn in here -->
    <section class="quote-list" id="quote-list"></section>
  </main>

  <!-- Reader: open a PDF, read it, turn sentences into quotes -->
  <section class="container reader" id="view-reader" hidden>

    <!-- Shown while no book is open -->
    <div class="reader-home" id="reader-home">
      <div class="drop-zone" id="drop-zone">
        <span class="icon" data-icon="book"></span>
        <h2 data-i18n="readerHomeTitle"></h2>
        <p data-i18n="readerIntro"></p>
        <button type="button" class="btn btn-primary" id="open-book-btn">
          <span data-icon="upload"></span><span data-i18n="readerOpen"></span>
        </button>
        <p class="drop-hint" data-i18n="readerDrop"></p>
        <p class="reader-status" id="reader-status" role="status"></p>
        <input type="file" id="book-input" accept=".pdf,application/pdf" hidden>
      </div>

      <section class="recent" id="recent" aria-labelledby="recent-title" hidden>
        <h2 id="recent-title" data-i18n="readerRecent"></h2>
        <p class="recent-hint" data-i18n="readerRecentHint"></p>
        <ul class="recent-list" id="recent-list"></ul>
      </section>
    </div>

    <!-- Shown while a book is open -->
    <div class="book" id="book" hidden>
      <div class="book-bar" id="book-bar">
        <div class="book-head">
          <button type="button" class="icon-btn" id="close-book-btn" data-i18n-label="readerClose">
            <span data-icon="back"></span>
          </button>
          <h2 class="book-title" id="book-title"></h2>
        </div>

        <div class="book-controls">
          <div class="ctrl-group">
            <button type="button" class="icon-btn" data-page-step="-1" data-i18n-label="readerPrev">
              <span data-icon="chevronLeft"></span>
            </button>
            <label class="sr-only" for="page-input" data-i18n="readerPageInput"></label>
            <input class="control page-input" type="number" id="page-input" min="1" inputmode="numeric">
            <span class="page-total" id="page-total"></span>
            <button type="button" class="icon-btn" data-page-step="1" data-i18n-label="readerNext">
              <span data-icon="chevronRight"></span>
            </button>
          </div>

          <div class="ctrl-group">
            <button type="button" class="icon-btn" id="zoom-out-btn" data-i18n-label="readerZoomOut">
              <span data-icon="minus"></span>
            </button>
            <button type="button" class="text-btn" id="zoom-reset-btn" data-i18n-label="readerZoomReset"></button>
            <button type="button" class="icon-btn" id="zoom-in-btn" data-i18n-label="readerZoomIn">
              <span data-icon="plus"></span>
            </button>
          </div>

          <div class="ctrl-group">
            <span data-icon="sun"></span>
            <label class="sr-only" for="brightness-input" data-i18n="readerBrightness"></label>
            <input class="range" type="range" id="brightness-input" min="50" max="100" step="5">
          </div>
        </div>
      </div>

      <div class="page-scroller" id="page-scroller">
        <div class="page-stage" id="page-stage"></div>
      </div>

      <div class="page-nav-bottom">
        <button type="button" class="btn btn-ghost" data-page-step="-1">
          <span data-icon="chevronLeft"></span><span data-i18n="readerPrevShort"></span>
        </button>
        <button type="button" class="btn btn-ghost" data-page-step="1">
          <span data-i18n="readerNextShort"></span><span data-icon="chevronRight"></span>
        </button>
      </div>
    </div>
  </section>

  <footer class="site-footer container">
    <h2 data-i18n="backupTitle"></h2>
    <p data-i18n="backupText"></p>
    <div class="footer-actions">
      <button type="button" class="btn btn-ghost" id="export-btn">
        <span data-icon="download"></span><span data-i18n="export"></span>
      </button>
      <button type="button" class="btn btn-ghost" id="import-btn">
        <span data-icon="upload"></span><span data-i18n="import"></span>
      </button>
      <input type="file" id="import-input" accept=".json,application/json" hidden>
    </div>
    <p class="shortcuts" id="shortcuts"></p>
  </footer>

  <button type="button" class="fab" id="add-btn" data-i18n-label="addQuote">
    <span data-icon="plus"></span>
    <span class="fab-label" data-i18n="addQuote"></span>
  </button>

  <!-- Appears while text is selected on a book page -->
  <div class="selection-bar" id="selection-bar" hidden>
    <button type="button" class="btn btn-primary" id="save-selection-btn">
      <span data-icon="bookmark"></span><span data-i18n="saveAsQuote"></span>
    </button>
  </div>

  <!-- Add / edit dialog. The native <dialog> gives us Esc-to-close and focus handling for free. -->
  <dialog id="quote-dialog" aria-labelledby="dialog-title">
    <form id="quote-form" novalidate>
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button type="button" class="icon-btn" id="dialog-close" data-i18n-label="close">
          <span data-icon="close"></span>
        </button>
      </div>

      <div class="dialog-body">
        <div class="field">
          <label for="field-text"><span data-i18n="fieldText"></span> <span class="req" aria-hidden="true">*</span></label>
          <textarea class="control" id="field-text" rows="5" maxlength="2000" required aria-describedby="error-text" data-i18n-placeholder="textPlaceholder"></textarea>
          <p class="field-error" id="error-text" role="alert" hidden></p>
        </div>

        <div class="field">
          <label for="field-book"><span data-i18n="fieldBook"></span> <span class="req" aria-hidden="true">*</span></label>
          <input class="control" type="text" id="field-book" maxlength="200" list="book-options" autocomplete="off" required aria-describedby="error-book">
          <datalist id="book-options"></datalist>
          <p class="field-error" id="error-book" role="alert" hidden></p>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="field-author" data-i18n="fieldAuthor"></label>
            <input class="control" type="text" id="field-author" maxlength="120" autocomplete="off">
          </div>
          <div class="field">
            <label for="field-page" data-i18n="fieldPage"></label>
            <input class="control" type="text" id="field-page" maxlength="30" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="field-note" data-i18n="fieldNote"></label>
          <textarea class="control" id="field-note" rows="2" maxlength="1000"></textarea>
        </div>

        <div class="field">
          <label for="field-tags" data-i18n="fieldTags"></label>
          <input class="control" type="text" id="field-tags" maxlength="200" autocomplete="off" data-i18n-placeholder="tagsPlaceholder">
        </div>
      </div>

      <div class="dialog-foot">
        <button type="button" class="btn btn-ghost" id="dialog-cancel" data-i18n="cancel"></button>
        <button type="submit" class="btn btn-primary" data-i18n="save"></button>
      </div>
    </form>
  </dialog>

  <!-- Small messages appear here (role=status makes screen readers announce them) -->
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script>
    "use strict";

    /* =========================================================
       HOW THIS FILE IS ORGANISED
         1. STRINGS      all visible text (English)
         2. CONFIG       storage keys, constants, icons
         3. HELPERS      small tools used everywhere
         4. STORAGE      the only code that touches localStorage
         5. STATE        the app's data in memory
         6. QUOTE LOGIC  clean-up, search, filter, merge (no DOM here)
         6b. BOOK LOGIC  the same for the list of books you have read
         7. RENDER       functions that draw the quotes on the page
         8. ACTIONS      change state, save, then re-render
         READER          the PDF reader: its own render + action functions
         9. EVENTS       connect buttons and keys to actions
        10. START        run everything

       EXTENDING THE READER (bookmarks, highlights, notes, search)
         - texts          -> add to STRINGS
         - saved data     -> add a field to the book record (see sanitizeBook)
         - drawing        -> do it in renderPage(), after the text layer is ready
         - buttons        -> add a listener in bindReaderEvents()
       ========================================================= */


    /* =========================================================
       1. STRINGS  (change any text of the app here)
       ========================================================= */
    const STRINGS = {
      // App
      appName: "Varaq",

      close: "Close",

      // Card
      cardFavorite: "Favorite",
      cardCopy: "Copy",
      cardImage: "Download as image",
      cardEdit: "Edit",
      cardDelete: "Delete",

      },
      importNoQuotes: "No quotes found in this file",
      importFailed: "This file is invalid or can't be read",
      storageError: "Couldn't save: browser storage is unavailable or full. Download a backup file!",
      storageCorrupted: "Saved data couldn't be read. A copy of it was kept separately.",

      // Empty states
      emptyTitle: "Your notebook is empty",
      emptyText: "When a line in a book stays with you, write it down here. It's lovely to come back to later.",
      emptyAction: "Add your first quote",
      noResultsTitle: "Nothing found",
      noResultsText: "Try changing the search or the filters.",

      // Reader: home
      readerHomeTitle: "Read a book",
      readerIntro: "Open a PDF from your computer. Your page is remembered, and any sentence can become a saved quote.",
      readerOpen: "Open a PDF",
      readerDrop: "or drop a PDF file here",
      readerRecent: "Recent books",
      readerRecentHint: "Choose the file again to continue where you stopped. The book itself isn't stored in the browser.",
      readerStopped: (page, pages) => (pages ? `Page ${page} of ${pages}` : `Page ${page}`),
      readerForget: "Remove from the list",
      readerForgot: "Removed from the list",
      untitledBook: "Untitled book",
      readerLoading: "Opening the book\u2026",

      // Reader: book
      readerClose: "Close book",
      readerPrev: "Previous page",
      readerNext: "Next page",
      readerPrevShort: "Previous",
      readerNextShort: "Next",
      readerPageInput: "Page number",
      readerOf: (n) => `of ${n}`,
      readerZoomIn: "Zoom in",
      readerZoomOut: "Zoom out",
      readerZoomReset: "Reset zoom",
      readerBrightness: "Page brightness",
      readerContinuing: (page) => `Continuing from page ${page}`,
      saveAsQuote: "Save as quote",

      // Reader: errors
      readerErrorNotPdf: "Please choose a PDF file.",
      readerErrorPassword: "This PDF is password-protected, so it can't be opened here.",
      readerErrorOpen: "This file couldn't be opened. It may be damaged.",
      readerErrorEngine: "The PDF engine couldn't be loaded. Check your internet connection and try again.",
      readerErrorPage: "This page couldn't be displayed.",

      // Footer
      backupTitle: "Backup",
      backupText: "Your quotes and reading progress are stored only in this browser. If the browser data is cleared, they can be lost, so download a backup file from time to time.",
      export: "Export",
      import: "Import",
      shortcuts: [
        ["N", "new quote"],
        ["/", "search"],
        ["\u2190 \u2192", "turn pages"],
        ["Esc", "close dialog"],
      ],
    };


    /* =========================================================
       2. CONFIG + ICONS
       ========================================================= */
    const FILE_PREFIX = "varaq";
    const STORAGE_KEYS = {
      quotes: "varaq:quotes",
      quotesCorruptedBackup: "varaq:quotes:corrupted-backup", // unreadable data is parked here, never thrown away
      theme: "varaq:theme",
      books: "varaq:books",                 // reading positions of the books you opened
      readerSettings: "varaq:reader-settings", // zoom + brightness
    };
    const THEMES = ["dark", "sepia", "light"];
    const DEFAULT_THEME = "dark";
    const EXPORT_VERSION = 2; // 2 = backups now also contain the list of books
    const UNDO_DURATION_MS = 6000;
    const DEFAULT_FILTERS = { search: "", book: "", tag: "", favoritesOnly: false, sort: "newest" };

    // Reader settings
    // The PDF library is loaded from a CDN the first time you open the Reader (never for quotes only).
    // The version is pinned on purpose: a new release can never silently change how the app behaves.
    const PDF_JS_VERSION = "3.11.174";
    const PDF_JS_BASE = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDF_JS_VERSION}`;
    const PDF_JS_URL = `${PDF_JS_BASE}/pdf.min.js`;
    const PDF_WORKER_URL = `${PDF_JS_BASE}/pdf.worker.min.js`;
    const PDF_CMAP_URL = `${PDF_JS_BASE}/cmaps/`; // lets PDFs with Chinese/Japanese/Korean text display correctly
    const MAX_PAGE_WIDTH = 880;        // px: on a big screen a page this wide is comfortable to read
    const MIN_PAGE_WIDTH = 260;
    const MIN_ZOOM = 0.5;
    const MAX_ZOOM = 3;
    const ZOOM_STEP = 0.25;
    const MIN_BRIGHTNESS = 50;
    const MAX_CANVAS_PIXELS = 16000000; // very large canvases crash phones, so we cap the sharpness
    const SWIPE_MIN_PX = 60;
    const MAX_RECENT_BOOKS = 8;

    /* =========================================================
       3. HELPERS
       ========================================================= */
    const $ = (id) => document.getElementById(id);

    /*
      el() builds a DOM element: el("p", { class: "note" }, "Hello").
      Text passed as a child is added as TEXT, never as HTML. This matters:
      an imported file could contain "<script>", and this keeps it harmless.
    */
    function el(tag, attrs = {}, ...children) {
      const node = document.createElement(tag);
      for (const [name, value] of Object.entries(attrs)) {
        if (value === null || value === undefined || value === false) continue;
        if (name === "class") node.className = value;
        else if (name === "dataset") Object.assign(node.dataset, value);
        else if (name.startsWith("on")) node.addEventListener(name.slice(2), value);
        else node.setAttribute(name, value === true ? "" : value);
      }
      for (const child of children) {
        if (child === null || child === undefined || child === false) continue;
        node.append(child);
      }
      return node;
    }

    function iconEl(name) {
      const node = el("span", { class: "icon" });
      node.innerHTML = ICONS[name]; // ICONS is our own trusted constant, not user data
      return node;
    }

    // Lower-case + single spaces, so "Atomic  Habits" and "atomic habits" compare as equal
    function normalize(value) {
      return String(value).toLowerCase().replace(/\s+/g, " ").trim();
    }

    // crypto.randomUUID() is not available everywhere (e.g. some file:// setups), so we make our own id
    function makeId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function formatDate(isoString) {
      const date = new Date(isoString);
      return STRINGS.formatDate(date.getDate(), STRINGS.months[date.getMonth()], date.getFullYear());
    }

    function todayStamp() {
      return new Date().toISOString().slice(0, 10);
    }

    // "sabr, #Hayot , sabr" -> ["sabr", "hayot"]
    function parseTags(input) {
      const list = Array.isArray(input) ? input : String(input ?? "").split(",");
      const cleaned = list
        .map((tag) => (typeof tag === "string" ? tag : ""))
        .map((tag) => tag.trim().replace(/^#+/, "").trim().toLowerCase())
        .filter(Boolean);
      return [...new Set(cleaned)]; // Set removes duplicates
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = el("a", { href: url, download: filename });
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // Fill texts and icons that are written in the HTML as data-i18n / data-icon
    function applyStaticStrings() {

        const text = STRINGS[node.dataset.i18nLabel] ?? "";
        node.setAttribute("aria-label", text); // read by screen readers
        node.setAttribute("title", text);      // tooltip for everyone else
      }
      for (const node of document.querySelectorAll("[data-icon]")) {
        node.innerHTML = ICONS[node.dataset.icon] ?? "";
        node.classList.add("icon");
      }
