    /* =========================================================
       4. STORAGE
       The only place that talks to localStorage. Every call is wrapped in
       try/catch because localStorage can throw (private mode, full disk,
       blocked by settings), and one crash here must never break the app.
       ========================================================= */
    function readStorage(key) {
      try {
        return localStorage.getItem(key);
      } catch (error) {
        return null;
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (error) {
        return false;
      }
    }

    // Returns { quotes, corrupted }. Broken data never crashes the app.
    function loadQuotes() {
      const raw = readStorage(STORAGE_KEYS.quotes);
      if (!raw) return { quotes: [], corrupted: false }; // first visit: nothing saved yet

      try {
        const quotes = extractQuotes(JSON.parse(raw));
        if (quotes === null) throw new Error("Unexpected data shape");
        return { quotes, corrupted: false };
      } catch (error) {
        // Park the unreadable text under another key: the next save would overwrite it,
        // and it might still be repairable by hand.
        writeStorage(STORAGE_KEYS.quotesCorruptedBackup, raw);
        return { quotes: [], corrupted: true };
      }
    }

    function saveQuotes(quotes) {
      return writeStorage(STORAGE_KEYS.quotes, JSON.stringify(quotes));
    }

    function loadTheme() {
      const saved = readStorage(STORAGE_KEYS.theme);
      return THEMES.includes(saved) ? saved : DEFAULT_THEME;
    }

    function saveTheme(theme) {
      writeStorage(STORAGE_KEYS.theme, theme);
    }

    // Books are saved as a list, but used in memory as an object { id: book } for quick lookup
    function loadBooks() {
      const raw = readStorage(STORAGE_KEYS.books);
      if (!raw) return {};
      try {
        const list = JSON.parse(raw);
        if (!Array.isArray(list)) return {};
        const books = {};
        for (const item of list) {
          const book = sanitizeBook(item);
          if (book) books[book.id] = book;
        }
        return books;
      } catch (error) {
        return {}; // unreadable reading positions are not precious: start fresh
      }
    }

    function saveBooks(books) {
      return writeStorage(STORAGE_KEYS.books, JSON.stringify(Object.values(books)));
    }

    function loadReaderSettings() {
      const defaults = { zoom: 1, brightness: 100 };
      const raw = readStorage(STORAGE_KEYS.readerSettings);
      if (!raw) return defaults;
      try {
        const saved = JSON.parse(raw);
        const zoom = Number(saved.zoom);
        const brightness = Number(saved.brightness);
        return {
          zoom: Number.isFinite(zoom) ? Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, zoom)) : defaults.zoom,
          brightness: Number.isFinite(brightness) ? Math.min(100, Math.max(MIN_BRIGHTNESS, brightness)) : defaults.brightness,
        };
      } catch (error) {
        return defaults;
      }
    }

    function saveReaderSettings(settings) {
      writeStorage(STORAGE_KEYS.readerSettings, JSON.stringify(settings));
    }


    /* =========================================================
       5. STATE
       One object holds everything that changes. Render functions only READ
       it; action functions CHANGE it. That keeps the app easy to follow.
       ========================================================= */
    const state = {
      quotes: [],                       // [{ id, text, book, author, page, note, tags, favorite, createdAt }]
      theme: DEFAULT_THEME,
      filters: { ...DEFAULT_FILTERS },
      dailyQuoteId: null,               // which quote is shown in "Quote of the day"
      editingId: null,                  // id of the quote in the dialog (null = adding a new one)
      dialogBookId: null,               // set when the dialog was opened from the Reader
      view: "quotes",                   // "quotes" or "reader"
      books: {},                        // { id: { id, title, author, pages, page, openedAt } }

      // Everything about the book that is open right now (null pdf = no book open)
      reader: {
        pdf: null,
        bookId: null,
        title: "",
        author: "",
        page: 1,
        pages: 0,
        zoom: 1,                        // 1 = fit the page width, 2 = twice as big
        brightness: 100,                // percent
        opening: false,
        renderId: 0,                    // counts page drawings, so an old one can't overwrite a newer one
        renderTask: null,
        renderedWidth: 0,
        selectedText: "",
      },
    };

    function findQuote(id) {
      return state.quotes.find((quote) => quote.id === id);
    }

    function hasActiveFilters() {
      const { search, book, tag, favoritesOnly } = state.filters;
      return search.trim() !== "" || book !== "" || tag !== "" || favoritesOnly;
    }


    /* =========================================================
       6. QUOTE LOGIC  (works on data only, never touches the page)
       ========================================================= */

    // Accepts anything and returns a clean quote object, or null if it is unusable.
    // Used for saved data AND imported files, so bad data can't get in either way.
    function sanitizeQuote(raw) {
      if (!raw || typeof raw !== "object") return null;

      const text = asCleanString(raw.text);
      const book = asCleanString(raw.book);
      if (!text || !book) return null; // the two required fields

      const created = new Date(raw.createdAt ?? NaN);
      return {
        id: asCleanString(raw.id) || makeId(),
        text,
        book,
        author: asCleanString(raw.author),
        page: asCleanString(raw.page),
        note: asCleanString(raw.note),
        tags: parseTags(raw.tags),
        favorite: raw.favorite === true,
        createdAt: isNaN(created) ? new Date().toISOString() : created.toISOString(),
      };
    }

    function asCleanString(value) {
      if (typeof value === "string") return value.trim();
      if (typeof value === "number") return String(value);
      return "";
    }

    // Understands our export format ({ quotes: [...] }) and a plain array.
    // Returns null when the data is not a list of quotes at all.
    function extractQuotes(data) {
      const list = Array.isArray(data) ? data : data && Array.isArray(data.quotes) ? data.quotes : null;
      if (!list) return null;
      return list.map((item) => sanitizeQuote(item)).filter(Boolean);
    }

    // Two quotes are "the same" if they have the same id, OR the same text in the same book.
    // The second rule catches copies made on another device (different ids).
    function duplicateKey(quote) {
      return `${normalize(quote.text)}||${normalize(quote.book)}`;
    }

    function mergeQuotes(existing, incoming) {
      const knownIds = new Set(existing.map((quote) => quote.id));
      const knownKeys = new Set(existing.map(duplicateKey));
      const merged = [...existing];
      let added = 0;
      let skipped = 0;

      for (const quote of incoming) {
        const key = duplicateKey(quote);
        if (knownIds.has(quote.id) || knownKeys.has(key)) {
          skipped++;
          continue;
        }
        merged.push(quote);
        knownIds.add(quote.id);
        knownKeys.add(key); // also protects against duplicates inside the imported file itself
        added++;
      }
      return { merged, added, skipped };
    }

    function getVisibleQuotes() {
      const { search, book, tag, favoritesOnly, sort } = state.filters;
      const needle = normalize(search);

      const matches = state.quotes.filter((quote) => {
        if (favoritesOnly && !quote.favorite) return false;
        if (book && normalize(quote.book) !== normalize(book)) return false;
        if (tag && !quote.tags.includes(tag)) return false;
        if (needle && !normalize(`${quote.text} ${quote.book} ${quote.author}`).includes(needle)) return false;
        return true;
      });

      // filter() made a new array, so sorting it does not disturb state.quotes
      const direction = sort === "oldest" ? 1 : -1;
      return matches.sort((a, b) => direction * (new Date(a.createdAt) - new Date(b.createdAt)));
    }

    // Unique book titles (case-insensitive), for the filter and the autocomplete
    function getBooks() {
      const byKey = new Map();
      for (const quote of state.quotes) {
        const key = normalize(quote.book);
        if (!byKey.has(key)) byKey.set(key, quote.book);
      }
      return [...byKey.values()].sort((a, b) => a.localeCompare(b));
    }

    function getTags() {
      return [...new Set(state.quotes.flatMap((quote) => quote.tags))].sort((a, b) => a.localeCompare(b));
    }

    function findAuthorForBook(book) {
      const match = state.quotes.find((quote) => quote.author && normalize(quote.book) === normalize(book));
      return match ? match.author : "";
    }

    // Picks a random quote id, avoiding `excludeId` so "Another one" really shows another one
    function pickRandomQuoteId(excludeId = null) {
      const others = state.quotes.filter((quote) => quote.id !== excludeId);
      const pool = others.length > 0 ? others : state.quotes;
      if (pool.length === 0) return null;
      return pool[Math.floor(Math.random() * pool.length)].id;
    }

    function formatQuoteForSharing(quote) {
      const source = [quote.author, quote.book].filter(Boolean).join(", ");
      const page = quote.page ? ` (${STRINGS.pageLabel(quote.page)})` : "";
      return `\u201C${quote.text}\u201D\n\u2014 ${source}${page}`;
    }


    /* =========================================================
       6b. BOOK LOGIC  (data only, like the quote logic above)
       A "book" is not the PDF file (that is too big for localStorage). It is a small
       record that remembers WHERE you stopped: { id, title, author, pages, page, openedAt }.
       ========================================================= */
    function sanitizeBook(raw) {
      if (!raw || typeof raw !== "object") return null;
      const id = asCleanString(raw.id);
      if (!id) return null;

      const pages = Math.max(0, Math.floor(Number(raw.pages)) || 0);
      let page = Math.max(1, Math.floor(Number(raw.page)) || 1);
      if (pages > 0) page = Math.min(page, pages);

      const opened = new Date(raw.openedAt ?? NaN);
      return {
        id,
        title: asCleanString(raw.title) || STRINGS.untitledBook,
        author: asCleanString(raw.author),
        pages,
        page,
        openedAt: isNaN(opened) ? new Date(0).toISOString() : opened.toISOString(),
      };
    }

    // Reads the "books" list of a backup file (an empty list if there is none)
    function extractBooks(data) {
      const list = data && Array.isArray(data.books) ? data.books : [];
      return list.map((item) => sanitizeBook(item)).filter(Boolean);
    }

    // Same idea as mergeQuotes: nothing is lost. If both sides know a book, the most recently read one wins.
    function mergeBooks(existing, incoming) {
      const merged = { ...existing };
      for (const book of incoming) {
        const current = merged[book.id];
        if (!current || new Date(book.openedAt) > new Date(current.openedAt)) merged[book.id] = book;
      }
      return merged;
    }

    // A PDF has a built-in "fingerprint" that stays the same even if you rename or move the file,
    // so we can recognise the same book next time. If it is missing we fall back to name + size.
    function getBookId(pdf, file) {
      const fingerprint = pdf.fingerprints && pdf.fingerprints[0];
      return fingerprint ? `pdf-${fingerprint}` : `file-${file.name}-${file.size}`;
    }

    // Titles inside PDFs are often junk ("Microsoft Word - doc1.docx"), so we check them first
    function guessBookInfo(metadata, file) {
      const info = (metadata && metadata.info) || {};
      const metaTitle = asCleanString(info.Title);
      const looksUseful =
        metaTitle.length >= 3 &&
        metaTitle.length <= 150 &&
        !/\.(docx?|indd|pdf|tex|pages)$/i.test(metaTitle) &&
        !/^(microsoft word|untitled)/i.test(metaTitle);

      const fileTitle = file.name.replace(/\.pdf$/i, "").replace(/_+/g, " ").replace(/\s+/g, " ").trim().slice(0, 200);
      return {
        title: looksUseful ? metaTitle : fileTitle || STRINGS.untitledBook,
        author: asCleanString(info.Author).slice(0, 120),
      };
    }

    // Selected text from a PDF has a line break at the end of every line. Make it read like normal text.
    function cleanSelectedText(raw) {
      return raw
        .replace(/(\p{L})-\s*\n\s*(?=\p{Ll})/gu, "$1")                  // "informa-\ntion" -> "information"
        .replace(/([\u3400-\u9fff])\s*\n\s*(?=[\u3400-\u9fff])/g, "$1") // Chinese has no spaces between words
        .replace(/\s*\n\s*/g, " ")                                       // any other line break -> a space
        .replace(/\s{2,}/g, " ")
        .trim();
    }


    /* =========================================================
       7. RENDER FUNCTIONS
       Each one reads `state` and updates one part of the page.
       ========================================================= */
    function renderAll() {
      renderQuoteOfDay();
      renderFilters();
      renderList();
    }

    function renderTheme() {
      document.documentElement.dataset.theme = state.theme;
      for (const button of dom.themeButtons) {
        button.setAttribute("aria-pressed", String(button.dataset.themeOption === state.theme));
      }
      // Colour the phone's browser bar like the page
      const background = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
      if (background) dom.themeColorMeta.setAttribute("content", background);
    }

    // "Author" on one line, "Book, page" under it
    function createSource(quote) {
      return el("p", { class: "source" },
        quote.author ? el("span", { class: "source-author" }, quote.author) : null,
        el("span", { class: "source-book" },
          el("cite", {}, quote.book),
          quote.page ? `, ${STRINGS.pageLabel(quote.page)}` : ""
        )
      );
    }

    function renderQuoteOfDay() {
      if (state.quotes.length === 0) {
        dom.daily.hidden = true;
        return;
      }

      // If the chosen quote was deleted (or nothing was chosen yet), choose again
      let quote = findQuote(state.dailyQuoteId);
      if (!quote) {
        state.dailyQuoteId = pickRandomQuoteId();
        quote = findQuote(state.dailyQuoteId);
      }

      dom.daily.hidden = false;
      dom.dailyText.textContent = quote.text;
      dom.dailySource.replaceChildren(createSource(quote));
      dom.anotherBtn.hidden = state.quotes.length < 2; // nothing else to show with a single quote
    }

    function renderFilters() {
      const books = getBooks();
      const tags = getTags();

      // A chosen book/tag can disappear (its last quote was deleted or renamed).
      // Reset it here so the dropdown and the list can never disagree.
      const matchingBook = books.find((book) => normalize(book) === normalize(state.filters.book));
      state.filters.book = matchingBook ?? "";
      if (!tags.includes(state.filters.tag)) state.filters.tag = "";

      fillSelect(dom.filterBook, STRINGS.allBooks, books, state.filters.book);
      fillSelect(dom.filterTag, STRINGS.allTags, tags, state.filters.tag);
      dom.sortSelect.value = state.filters.sort;
      dom.filterFavorites.checked = state.filters.favoritesOnly;

      // Only touch the search box if it differs, otherwise the cursor would jump while typing
      if (dom.searchInput.value !== state.filters.search) dom.searchInput.value = state.filters.search;

      dom.toolbar.hidden = state.quotes.length === 0;
    }

    function fillSelect(select, allLabel, values, selected) {
      const options = [
        el("option", { value: "" }, allLabel),
        ...values.map((value) => el("option", { value }, value)),
      ];
      select.replaceChildren(...options);
      select.value = selected;
    }

    function renderList() {
      const savedFocus = rememberFocus();
      const total = state.quotes.length;
      const visible = getVisibleQuotes();
      const filtered = hasActiveFilters();

      dom.resultsMeta.hidden = total === 0;
      dom.resultsCount.textContent = filtered
        ? STRINGS.quotesCountFiltered(visible.length, total)
        : STRINGS.quotesCount(total);
      dom.clearFiltersBtn.hidden = !filtered;

      let children;
      if (total === 0) {
        children = [createEmptyState({
          title: STRINGS.emptyTitle,
          text: STRINGS.emptyText,
          actionLabel: STRINGS.emptyAction,
          action: "add",
          primary: true,
        })];
      } else if (visible.length === 0) {
        children = [createEmptyState({
          title: STRINGS.noResultsTitle,
          text: STRINGS.noResultsText,
          actionLabel: STRINGS.clearFilters,
          action: "clear-filters",
          primary: false,
        })];
      } else {
        children = visible.map(createQuoteCard);
      }

      dom.list.replaceChildren(...children);
      restoreFocus(savedFocus);
    }

    // Re-drawing the list replaces its buttons, which would drop keyboard focus.
    // We remember which button was focused and focus its twin afterwards.
    function rememberFocus() {
      const active = document.activeElement;
      if (!active || !dom.list.contains(active)) return null;
      const card = active.closest("[data-id]");
      return card ? { id: card.dataset.id, action: active.dataset.action } : null;
    }

    function restoreFocus(saved) {
      if (!saved) return;
      const card = [...dom.list.querySelectorAll("[data-id]")].find((node) => node.dataset.id === saved.id);
      if (!card) return;
      const button = [...card.querySelectorAll("[data-action]")].find((node) => node.dataset.action === saved.action);
      if (button) button.focus();
    }

    function createEmptyState({ title, text, actionLabel, action, primary }) {
      return el("div", { class: "empty" },
        iconEl("book"),
        el("h2", {}, title),
        el("p", {}, text),
        el("button", { type: "button", class: primary ? "btn btn-primary" : "btn btn-ghost", dataset: { action } }, actionLabel)
      );
    }

    function createQuoteCard(quote) {
      return el("article", { class: "card", dataset: { id: quote.id } },
        el("blockquote", { class: "card-text" }, quote.text),
        createSource(quote),
        quote.note ? el("p", { class: "card-note" }, quote.note) : null,
        quote.tags.length > 0 ? el("ul", { class: "tags" }, ...quote.tags.map(createTagItem)) : null,
        el("div", { class: "card-footer" },
          el("time", { class: "card-date", datetime: quote.createdAt }, formatDate(quote.createdAt)),
          createCardActions(quote)
        )
      );
    }

    function createTagItem(tag) {
      return el("li", {},
        el("button", {
          type: "button",
          class: "tag",
          title: STRINGS.tagFilterHint(tag),
          "aria-pressed": String(state.filters.tag === tag),
          dataset: { action: "filter-tag", tag },
        }, `#${tag}`)
      );
    }

    function createCardActions(quote) {
      return el("div", { class: "card-actions" },
        createActionButton("favorite", "heart", STRINGS.cardFavorite, { pressed: quote.favorite }),
        createActionButton("copy", "copy", STRINGS.cardCopy),
        createActionButton("image", "image", STRINGS.cardImage),
        createActionButton("edit", "edit", STRINGS.cardEdit),
        createActionButton("delete", "trash", STRINGS.cardDelete, { danger: true })
      );
    }

    function createActionButton(action, iconName, label, { pressed, danger } = {}) {
      return el("button", {
        type: "button",
        class: danger ? "icon-btn danger" : "icon-btn",
        title: label,
        "aria-label": label,
        "aria-pressed": pressed === undefined ? null : String(pressed), // only the heart is a toggle
        dataset: { action },
      }, iconEl(iconName));
    }

    function renderShortcuts() {
      const items = STRINGS.shortcuts.map(([key, label]) =>
        el("span", {}, el("kbd", {}, key), label)
      );
      dom.shortcuts.replaceChildren(...items);
    }

    // A small message at the bottom of the screen. Several can be visible at once,
    // each with its own timer, so a second delete never cancels the first "Undo".
    function showToast(message, { actionLabel = "", onAction = null, duration = 3000 } = {}) {
      let timer = null;
      const toast = el("div", { class: "toast" }, el("span", {}, message));
      const dismiss = () => {
        clearTimeout(timer);
        toast.remove();
      };

      if (actionLabel) {
        toast.append(el("button", {
          type: "button",
          class: "toast-action",
          onclick: () => {
            dismiss();
            if (onAction) onAction();
          },
        }, actionLabel));
      }

      timer = setTimeout(dismiss, duration);
      dom.toasts.append(toast);
    }


    /* =========================================================
       8. ACTIONS  (change state -> save -> re-render)
       ========================================================= */
    function persistQuotes() {
      if (!saveQuotes(state.quotes)) showToast(STRINGS.storageError, { duration: 8000 });
    }

    function setTheme(theme) {
      state.theme = theme;
      saveTheme(theme);
      renderTheme();
    }

    function setFilter(patch) {
      Object.assign(state.filters, patch);
      renderFilters();
      renderList();
    }

    function clearFilters() {
      // Keep the sort order: it is a display choice, not a filter
      state.filters = { ...DEFAULT_FILTERS, sort: state.filters.sort };
      renderFilters();
      renderList();
    }

    function addQuote(values) {
      const quote = { id: makeId(), ...values, favorite: false, createdAt: new Date().toISOString() };
      state.quotes.push(quote);
      // Clear filters so the new quote is guaranteed to be visible
      state.filters = { ...DEFAULT_FILTERS, sort: state.filters.sort };
      persistQuotes();
      renderAll();
      showToast(STRINGS.savedToast);
    }

    function updateQuote(id, values) {
      const quote = findQuote(id);
      if (!quote) return;
      Object.assign(quote, values);
      persistQuotes();
      renderAll();
      showToast(STRINGS.updatedToast);
    }

    function toggleFavorite(id) {
      const quote = findQuote(id);
      if (!quote) return;
      quote.favorite = !quote.favorite;
      persistQuotes();
      renderAll();
    }

    // No "Are you sure?" dialog: delete right away and offer an Undo for a few seconds.
    // It is faster to use and just as safe.
    function deleteQuote(id) {
      const index = state.quotes.findIndex((quote) => quote.id === id);
      if (index === -1) return;

      const [removed] = state.quotes.splice(index, 1);
      persistQuotes();
      renderAll();

      showToast(STRINGS.deletedToast, {
        actionLabel: STRINGS.undo,
        duration: UNDO_DURATION_MS,
        onAction: () => {
          state.quotes.push(removed); // the list is sorted by date when drawn, so position doesn't matter
          persistQuotes();
          renderAll();
          showToast(STRINGS.restoredToast);
        },
      });
    }

    async function copyQuote(id) {
      const quote = findQuote(id);
      if (!quote) return;
      const copied = await copyToClipboard(formatQuoteForSharing(quote));
      showToast(copied ? STRINGS.copiedToast : STRINGS.copyFailed);
    }

    async function copyToClipboard(text) {
      // Modern way (needs a secure context such as https or localhost)
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (error) {
          // fall through to the old method
        }
      }
      return legacyCopy(text);
    }

    // Old-school fallback: put the text in a hidden textarea and use the copy command
    function legacyCopy(text) {
      const previouslyFocused = document.activeElement;
      const area = el("textarea", { readonly: true, "aria-hidden": "true", style: "position:fixed;top:0;left:0;opacity:0" }, text);
      document.body.append(area);
      area.select();
      area.setSelectionRange(0, text.length);
      let copied = false;
      try {
        copied = document.execCommand("copy");
      } catch (error) {
        copied = false;
      }
      area.remove();
      if (previouslyFocused && previouslyFocused.focus) previouslyFocused.focus();
      return copied;
    }

    /* ----- Export / import ----- */
    function exportQuotes() {
      if (state.quotes.length === 0 && Object.keys(state.books).length === 0) {
        showToast(STRINGS.exportEmpty);
        return;
      }
      const payload = {
        app: FILE_PREFIX,
        version: EXPORT_VERSION,
        exportedAt: new Date().toISOString(),
        quotes: state.quotes,
        books: Object.values(state.books), // where you stopped in each book
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      downloadBlob(blob, `${FILE_PREFIX}-backup-${todayStamp()}.json`);
      showToast(STRINGS.exportDone(state.quotes.length));
    }

    async function importQuotes(file) {
      try {
        const data = JSON.parse(await file.text());
        const incomingQuotes = extractQuotes(data); // null = not a quotes file at all
        const incomingBooks = extractBooks(data);   // [] when the file has no books (older backups)
        const hasBooksList = Boolean(data) && Array.isArray(data.books);
        if (incomingQuotes === null && !hasBooksList) throw new Error("Not a backup file");

        const quotesToAdd = incomingQuotes || [];
        if (quotesToAdd.length === 0 && incomingBooks.length === 0) {
          showToast(STRINGS.importNoQuotes);
          return;
        }

        // Merge (never replace): what you already have stays, only new things are added
        const { merged, added, skipped } = mergeQuotes(state.quotes, quotesToAdd);
        state.quotes = merged;
        state.books = mergeBooks(state.books, incomingBooks);
        persistQuotes();
        persistBooks();
        renderAll();
        renderReader();
        showToast(STRINGS.importDone(added, skipped), { duration: 5000 });
      } catch (error) {
        showToast(STRINGS.importFailed, { duration: 5000 });
      }
    }

    /* ----- Share as an image (canvas) ----- */
    async function downloadQuoteImage(id) {
      const quote = findQuote(id);
      if (!quote) return;

      try {
        await waitForCanvasFonts();
        const canvas = drawQuoteImage(quote);
        const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
        if (!blob) throw new Error("Could not create image");
        downloadBlob(blob, `${FILE_PREFIX}-quote-${todayStamp()}.png`);
        showToast(STRINGS.imageDone);
      } catch (error) {
        showToast(STRINGS.imageFailed);
      }
    }

    // A canvas can only use a web font after the browser has downloaded it, so we ask for it first.
    // If the fonts are unavailable (offline), the canvas simply uses the fallback fonts.
    async function waitForCanvasFonts() {
      try {
        await Promise.all([
          document.fonts.load("italic 40px Lora"),
          document.fonts.load("600 34px Inter"),
        ]);
      } catch (error) {
        // ignore: fallback fonts are fine
      }
    }

    // Draws the quote on a 1080x1350 picture using the CURRENT theme's colours,
    // read from the same CSS variables the page uses.
    function drawQuoteImage(quote) {
      const WIDTH = 1080;
      const HEIGHT = 1350;
      const PADDING = 100;
      const LINE_HEIGHT = 1.45;
      const contentWidth = WIDTH - PADDING * 2;

      const css = getComputedStyle(document.documentElement);
      const read = (name) => css.getPropertyValue(name).trim();
      const serif = read("--font-serif");
      const sans = read("--font-ui");

      const canvas = document.createElement("canvas");
      canvas.width = WIDTH;
      canvas.height = HEIGHT;
      const ctx = canvas.getContext("2d");
      ctx.textBaseline = "top";

      // Background: soft diagonal gradient plus a thin frame, like a book page
      const background = ctx.createLinearGradient(0, 0, WIDTH, HEIGHT);
      background.addColorStop(0, read("--bg"));
      background.addColorStop(1, read("--surface-2"));
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.strokeStyle = read("--border");
      ctx.lineWidth = 2;
      ctx.strokeRect(44, 44, WIDTH - 88, HEIGHT - 88);

      // Big opening quote mark
      ctx.fillStyle = read("--accent");
      ctx.font = `200px ${serif}`;
      ctx.fillText("\u201C", PADDING, PADDING - 10);

      // Work from the bottom up: brand, then the source lines, then whatever space is left is for the quote
      const brandTop = HEIGHT - PADDING - 30;

      ctx.font = `600 36px ${sans}`;
      const authorLines = quote.author ? limitLines(wrapText(ctx, quote.author, contentWidth), 2) : [];
      ctx.font = `italic 32px ${serif}`;
      const bookText = quote.page ? `${quote.book}, ${STRINGS.pageLabel(quote.page)}` : quote.book;
      const bookLines = limitLines(wrapText(ctx, bookText, contentWidth), 2);

      const AUTHOR_LINE = 48;
      const BOOK_LINE = 44;
      const sourceHeight = authorLines.length * AUTHOR_LINE + bookLines.length * BOOK_LINE;
      const sourceTop = brandTop - 60 - sourceHeight;

      const quoteTop = PADDING + 150;
      const quoteBottom = sourceTop - 70;
      const availableHeight = quoteBottom - quoteTop;

      // Quote text: the largest font size that fits
      const fitted = fitQuoteText(ctx, quote.text, contentWidth, availableHeight, serif, LINE_HEIGHT);
      const lineHeight = fitted.size * LINE_HEIGHT;
      const maxLines = Math.max(1, Math.floor(availableHeight / lineHeight));
      const quoteLines = limitLines(fitted.lines, maxLines);

      ctx.font = `italic ${fitted.size}px ${serif}`;
      ctx.fillStyle = read("--text");
      let y = quoteTop; // starts right under the quote mark, so the two read as one piece
      for (const line of quoteLines) {
        ctx.fillText(line, PADDING, y);
        y += lineHeight;
      }

      // Small accent rule, then author and book
      ctx.fillStyle = read("--accent");
      ctx.fillRect(PADDING, sourceTop - 36, 80, 4);

      let sourceY = sourceTop;
      ctx.fillStyle = read("--text");
      ctx.font = `600 36px ${sans}`;
      for (const line of authorLines) {
        ctx.fillText(line, PADDING, sourceY);
        sourceY += AUTHOR_LINE;
      }
      ctx.fillStyle = read("--text-muted");
      ctx.font = `italic 32px ${serif}`;
      for (const line of bookLines) {
        ctx.fillText(line, PADDING, sourceY);
        sourceY += BOOK_LINE;
      }

      // App name in the corner
      ctx.fillStyle = read("--text-muted");
      ctx.font = `600 28px ${serif}`;
      ctx.fillText(STRINGS.appName, PADDING, brandTop);

      return canvas;
    }

    // Tries font sizes from big to small until the wrapped text fits into maxHeight
    function fitQuoteText(ctx, text, maxWidth, maxHeight, serif, lineHeightRatio) {
      const MAX_SIZE = 60;
      const MIN_SIZE = 28;
      let result = null;
      for (let size = MAX_SIZE; size >= MIN_SIZE; size -= 2) {
        ctx.font = `italic ${size}px ${serif}`;
        const lines = wrapText(ctx, text, maxWidth);
        result = { size, lines };
        if (lines.length * size * lineHeightRatio <= maxHeight) break;
      }
      return result; // at the smallest size the text may still be too long: the caller cuts it with "..."
    }

    // Splits text into lines that fit maxWidth (uses the font currently set on ctx).
    // A single word wider than the whole line is not split: very rare, so we keep the code simple.
    function wrapText(ctx, text, maxWidth) {
      const lines = [];
      for (const paragraph of text.split("\n")) {
        let line = "";
        for (const word of paragraph.split(/\s+/).filter(Boolean)) {
          const attempt = line ? `${line} ${word}` : word;
          if (line && ctx.measureText(attempt).width > maxWidth) {
            lines.push(line);
            line = word;
          } else {
            line = attempt;
          }
        }
        lines.push(line); // an empty paragraph becomes an empty line
      }
      return lines;
    }

    function limitLines(lines, maxLines) {
      if (lines.length <= maxLines) return lines;
      const kept = lines.slice(0, maxLines);
      kept[maxLines - 1] = kept[maxLines - 1].replace(/[\s.,;:!?]+$/, "") + "\u2026";
      return kept;
    }

    /* ----- The add / edit dialog ----- */
    // `prefill` is used by the Reader: { text, book, author, page, bookId } filled in from the page you are reading
    function openQuoteDialog(id = null, prefill = null) {
      const quote = id ? findQuote(id) : null;
      const start = quote || prefill || {};
      state.editingId = quote ? quote.id : null;
      state.dialogBookId = !quote && prefill && prefill.bookId ? prefill.bookId : null;

      dom.dialogTitle.textContent = quote ? STRINGS.editQuote : STRINGS.addQuote;
      dom.fieldText.value = start.text || "";
      dom.fieldBook.value = start.book || "";
      dom.fieldAuthor.value = start.author || "";
      dom.fieldPage.value = start.page || "";
      dom.fieldNote.value = quote ? quote.note : "";
      dom.fieldTags.value = quote ? quote.tags.join(", ") : "";

      setFieldError(dom.fieldText, dom.errorText, "");
      setFieldError(dom.fieldBook, dom.errorBook, "");

      // Autocomplete list of books you already have
      dom.bookOptions.replaceChildren(...getBooks().map((book) => el("option", { value: book })));

      if (!dom.dialog.open) dom.dialog.showModal();
      dom.fieldText.focus();
    }

    function closeQuoteDialog() {
      if (dom.dialog.open) dom.dialog.close();
    }

    function readForm() {
      return {
        text: dom.fieldText.value.trim(),
        book: dom.fieldBook.value.trim(),
        author: dom.fieldAuthor.value.trim(),
        page: dom.fieldPage.value.trim(),
        note: dom.fieldNote.value.trim(),
        tags: parseTags(dom.fieldTags.value),
      };
    }

    function setFieldError(input, errorNode, message) {
      errorNode.textContent = message;
      errorNode.hidden = message === "";
      input.setAttribute("aria-invalid", message === "" ? "false" : "true");
    }

    // Returns true when the form can be saved. Shows a message under each missing field.
    function validateForm(values) {
      const checks = [
        { input: dom.fieldText, errorNode: dom.errorText, message: values.text ? "" : STRINGS.errorText },
        { input: dom.fieldBook, errorNode: dom.errorBook, message: values.book ? "" : STRINGS.errorBook },
      ];
      for (const check of checks) setFieldError(check.input, check.errorNode, check.message);

      const firstProblem = checks.find((check) => check.message !== "");
      if (firstProblem) firstProblem.input.focus();
      return !firstProblem;
    }


    /* =========================================================
       READER (PDF)
       Same pattern as the quotes part: `state.reader` holds the data,
       render functions draw it, action functions change it.
       The PDF library is "pdf.js" (made by Mozilla, used inside Firefox).
       ========================================================= */
    const reader = state.reader;       // short name for state.reader
    let pdfEnginePromise = null;       // the library is downloaded once, the first time it is needed
    let touchStart = null;             // where the current finger swipe began
    let selectionTimer = null;         // small delay, so we don't react to every tiny selection change
    let resizeTimer = null;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function makeNamedError(name) {
      const error = new Error(name);
      error.name = name;
      return error;
    }

    /* ----- Loading the PDF library ----- */
    function prepareEngine(library) {
      // The "worker" is a helper that reads the PDF in the background, so the page never freezes
      if (library.GlobalWorkerOptions && !library.GlobalWorkerOptions.workerSrc) {
        library.GlobalWorkerOptions.workerSrc = PDF_WORKER_URL;
      }
      return library;
    }

    function loadPdfEngine() {
      if (window.pdfjsLib) return Promise.resolve(prepareEngine(window.pdfjsLib));

      if (!pdfEnginePromise) {
        pdfEnginePromise = new Promise((resolve, reject) => {
          const script = el("script", { src: PDF_JS_URL });
          script.addEventListener("load", () => {
            if (window.pdfjsLib) resolve(prepareEngine(window.pdfjsLib));
            else reject(makeNamedError("EngineError"));
          });
          script.addEventListener("error", () => reject(makeNamedError("EngineError")));
          document.head.append(script);
        }).catch((error) => {
          pdfEnginePromise = null; // forget the failure, so the next try starts fresh (e.g. after the internet is back)
          throw error;
        });
      }
      return pdfEnginePromise;
    }

    /* ----- Switching between Quotes and Reader ----- */
    function showView(view) {
      state.view = view;
      renderView();
      // A hidden element has no width, so a page can only be drawn once the Reader is visible
      if (view === "reader" && reader.pdf) renderPage();
      window.scrollTo(0, 0);
    }

    function renderView() {
      const isReader = state.view === "reader";
      dom.viewQuotes.hidden = isReader;
      dom.viewReader.hidden = !isReader;
      dom.addBtn.hidden = isReader; // in the Reader, quotes are created from selected text instead
      for (const button of dom.navButtons) {
        if (button.dataset.view === state.view) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      }
      hideSelectionBar();
    }

    /* ----- Render functions ----- */
    function renderReader() {
      const isOpen = reader.pdf !== null;
      dom.readerHome.hidden = isOpen;
      dom.book.hidden = !isOpen;

      if (!isOpen) {
        renderRecentBooks();
        return;
      }
      dom.bookTitle.textContent = reader.title;
      dom.bookTitle.title = reader.title; // full title as a tooltip when it is cut with "..."
      renderControls();
    }

    function renderControls() {
      dom.pageInput.value = reader.page;
      dom.pageInput.max = reader.pages;
      dom.pageTotal.textContent = STRINGS.readerOf(reader.pages);

      for (const button of dom.pageStepButtons) {
        const step = Number(button.dataset.pageStep);
        button.disabled = step < 0 ? reader.page <= 1 : reader.page >= reader.pages;
      }

      dom.zoomResetBtn.textContent = `${Math.round(reader.zoom * 100)}%`;
      dom.zoomOutBtn.disabled = reader.zoom <= MIN_ZOOM;
      dom.zoomInBtn.disabled = reader.zoom >= MAX_ZOOM;
      dom.brightnessInput.value = reader.brightness;
    }

    function renderRecentBooks() {
      const books = Object.values(state.books)
        .sort((a, b) => new Date(b.openedAt) - new Date(a.openedAt))
        .slice(0, MAX_RECENT_BOOKS);

      dom.recent.hidden = books.length === 0;
      dom.recentList.replaceChildren(...books.map(createRecentItem));
    }

    function createRecentItem(book) {
      return el("li", { class: "recent-item", dataset: { id: book.id } },
        el("button", { type: "button", class: "recent-open", dataset: { action: "pick-book" } },
          el("span", { class: "recent-title" }, book.title),
          book.author ? el("span", { class: "recent-author" }, book.author) : null,
          el("span", { class: "recent-page" }, STRINGS.readerStopped(book.page, book.pages))
        ),
        el("button", {
          type: "button",
          class: "icon-btn",
          title: STRINGS.readerForget,
          "aria-label": STRINGS.readerForget,
          dataset: { action: "forget-book" },
        }, iconEl("close"))
      );
    }

    function applyBrightness() {
      // The CSS reads this variable (see ".page canvas")
      dom.pageStage.style.setProperty("--page-brightness", String(reader.brightness / 100));
    }

    /*
      Draws the current page: first the picture (canvas), then an invisible text layer on top.
      Why the "renderId": drawing is asynchronous. If you flip pages quickly, an older drawing
      may finish AFTER a newer one started. Each drawing gets a number and gives up
      as soon as it is no longer the newest.
    */
    async function renderPage() {
      if (!reader.pdf || state.view !== "reader") return;

      const renderId = ++reader.renderId;
      if (reader.renderTask) {
        reader.renderTask.cancel(); // stop drawing the previous page
        reader.renderTask = null;
      }
      dom.pageStage.setAttribute("aria-busy", "true");

      try {
        const page = await reader.pdf.getPage(reader.page);
        if (renderId !== reader.renderId) return;

        // Size: fit the page to the available width (but never wider than MAX_PAGE_WIDTH), then apply the zoom
        reader.renderedWidth = dom.pageScroller.clientWidth;
        const available = Math.max(MIN_PAGE_WIDTH, reader.renderedWidth);
        const naturalWidth = page.getViewport({ scale: 1 }).width;
        const fitScale = Math.min(available, MAX_PAGE_WIDTH) / naturalWidth;
        const viewport = page.getViewport({ scale: fitScale * reader.zoom });

        // Sharpness: draw more pixels on high-density screens (phones, laptops with 2x screens),
        // but cap the total so a huge zoom can't exhaust memory.
        const pixelRatio = window.devicePixelRatio || 1;
        const maxRatio = Math.sqrt(MAX_CANVAS_PIXELS / (viewport.width * viewport.height));
        const outputScale = Math.min(pixelRatio, maxRatio);

        // We draw on a NEW canvas and swap it in when ready, so the old page stays visible meanwhile (no flicker)
        const canvas = el("canvas", { role: "img" });
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = `${viewport.width}px`;
        canvas.style.height = `${viewport.height}px`;

        const textLayer = el("div", { class: "textLayer" });
        // pdf.js sizes the invisible text with calc(var(--scale-factor) * ...). Without this line the
        // text would not line up with the picture, and selecting would grab the wrong words.
        textLayer.style.setProperty("--scale-factor", String(viewport.scale));
        const pageElement = el("div", { class: "page", style: `width:${viewport.width}px;height:${viewport.height}px` }, canvas, textLayer);

        const task = page.render({
          canvasContext: canvas.getContext("2d"),
          viewport,
          transform: [outputScale, 0, 0, outputScale, 0, 0],
        });
        reader.renderTask = task;
        await task.promise;
        reader.renderTask = null;
        if (renderId !== reader.renderId) return;

        dom.pageStage.replaceChildren(pageElement);
        await drawTextLayer(page, textLayer, viewport, renderId);
      } catch (error) {
        if (error && error.name === "RenderingCancelledException") return; // we cancelled it on purpose
        if (renderId === reader.renderId) showToast(STRINGS.readerErrorPage);
      } finally {
        if (renderId === reader.renderId) dom.pageStage.removeAttribute("aria-busy");
      }
    }

    // The text layer is invisible text placed exactly over the picture. It is what makes selecting possible.
    async function drawTextLayer(page, container, viewport, renderId) {
      try {
        await window.pdfjsLib.renderTextLayer({
          textContentSource: page.streamTextContent(),
          container,
          viewport,
          textDivs: [],
        }).promise;
        if (renderId !== reader.renderId) return;
        container.append(el("div", { class: "endOfContent" }));
      } catch (error) {
        // Without a text layer the page is still readable, you just can't select text. Not worth an error message.
      }
    }

    /* ----- Selection -> quote ----- */
    function getSelectedPageText() {
      if (state.view !== "reader" || !reader.pdf) return "";
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0 || selection.isCollapsed) return "";
      // Only selections inside the book page count (not, say, text in the footer)
      if (!dom.pageStage.contains(selection.getRangeAt(0).commonAncestorContainer)) return "";
      return cleanSelectedText(selection.toString());
    }

    function updateSelectionBar() {
      reader.selectedText = getSelectedPageText();
      dom.selectionBar.hidden = reader.selectedText === "";
    }

    function hideSelectionBar() {
      reader.selectedText = "";
      dom.selectionBar.hidden = true;
    }

    function clearPageSelection() {
      const selection = window.getSelection();
      if (selection) selection.removeAllRanges();
      hideSelectionBar();
    }

    function saveSelectionAsQuote() {
      if (!reader.selectedText) return;
      openQuoteDialog(null, {
        text: reader.selectedText,
        book: reader.title,
        author: reader.author || findAuthorForBook(reader.title),
        page: String(reader.page),
        bookId: reader.bookId,
      });
    }

    // After saving a quote from the Reader: if you fixed the book title in the dialog,
    // the Reader remembers your version, so the next quote starts with the right title.
    function finishQuoteFromReader(values) {
      const book = state.books[state.dialogBookId];
      if (book && values.book) {
        book.title = values.book;
        if (values.author) book.author = values.author;
        if (reader.bookId === book.id) {
          reader.title = book.title;
          reader.author = book.author;
          dom.bookTitle.textContent = reader.title;
          dom.bookTitle.title = reader.title;
        }
        persistBooks();
      }
      clearPageSelection();
    }

    /* ----- Actions: opening and closing books ----- */
    function persistBooks() {
      if (!saveBooks(state.books)) showToast(STRINGS.storageError, { duration: 8000 });
    }

    function looksLikePdf(file) {
      return file.type === "application/pdf" || /\.pdf$/i.test(file.name);
    }

    function setReaderBusy(busy) {
      reader.opening = busy;
      dom.openBookBtn.disabled = busy;
      dom.readerStatus.textContent = busy ? STRINGS.readerLoading : "";
    }

    function describeOpenError(error) {
      if (error && error.name === "PasswordException") return STRINGS.readerErrorPassword;
      if (error && error.name === "EngineError") return STRINGS.readerErrorEngine;
      return STRINGS.readerErrorOpen;
    }

    async function openBookFile(file) {
      if (!file || reader.opening) return;
      if (!looksLikePdf(file)) {
        showToast(STRINGS.readerErrorNotPdf);
        return;
      }

      setReaderBusy(true);
      try {
        const library = await loadPdfEngine();
        const data = new Uint8Array(await file.arrayBuffer());
        const pdf = await library.getDocument({ data, cMapUrl: PDF_CMAP_URL, cMapPacked: true }).promise;
        await startReading(pdf, file);
      } catch (error) {
        showToast(describeOpenError(error), { duration: 6000 });
      } finally {
        setReaderBusy(false);
      }
    }

    async function startReading(pdf, file) {
      if (reader.pdf) closeBook(); // one book at a time

      let metadata = null;
      try {
        metadata = await pdf.getMetadata();
      } catch (error) {
        // metadata is a bonus: the file name works as a title
      }

      const id = getBookId(pdf, file);
      const known = state.books[id]; // have we read this book before?
      const guess = guessBookInfo(metadata, file);

      reader.pdf = pdf;
      reader.bookId = id;
      reader.pages = pdf.numPages;
      reader.title = known ? known.title : guess.title;   // a title you corrected earlier wins
      reader.author = known ? known.author : guess.author;
      reader.page = clamp(known ? known.page : 1, 1, pdf.numPages);

      rememberBook();
      applyBrightness();
      renderReader();                      // show the book area first: the page needs its width to be measured
      scrollToPageTop();
      await renderPage();
      if (known && reader.page > 1) showToast(STRINGS.readerContinuing(reader.page));
    }

    // Saves "where I am" for this book. Called on every page change.
    function rememberBook() {
      if (!reader.bookId) return;
      state.books[reader.bookId] = {
        id: reader.bookId,
        title: reader.title,
        author: reader.author,
        pages: reader.pages,
        page: reader.page,
        openedAt: new Date().toISOString(),
      };
      persistBooks();
    }

    function closeBook() {
      reader.renderId++; // any drawing still in progress must give up
      if (reader.renderTask) reader.renderTask.cancel();
      if (reader.pdf) {
        try {
          const closing = reader.pdf.destroy();
          if (closing && closing.catch) closing.catch(() => {});
        } catch (error) {
          // nothing to do: we are leaving this book anyway
        }
      }
      Object.assign(reader, { pdf: null, bookId: null, title: "", author: "", page: 1, pages: 0, renderTask: null, selectedText: "" });
      dom.pageStage.replaceChildren();
      hideSelectionBar();
      renderReader();
      window.scrollTo(0, 0);
    }

    function forgetBook(id) {
      delete state.books[id];
      persistBooks();
      renderRecentBooks();
      showToast(STRINGS.readerForgot);
    }

    /* ----- Actions: pages, zoom, brightness ----- */
    function scrollToPageTop() {
      // On wide screens the toolbar sticks to the top, so the page must start just below it
      const barIsSticky = getComputedStyle(dom.bookBar).position === "sticky";
      const offset = barIsSticky ? dom.bookBar.offsetHeight + 16 : 8;
      const top = dom.pageScroller.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo(0, Math.max(0, top));
    }

    function goToPage(number) {
      if (!reader.pdf) return;
      if (!Number.isFinite(number)) {
        renderControls(); // put the old, valid number back into the input
        return;
      }
      const target = clamp(Math.round(number), 1, reader.pages);
      if (target === reader.page) {
        renderControls();
        return;
      }
      reader.page = target;
      rememberBook();
      renderControls();
      hideSelectionBar();
      scrollToPageTop();
      renderPage();
    }

    function changePage(step) {
      goToPage(reader.page + step);
    }

    function setZoom(value) {
      reader.zoom = clamp(Math.round(value * 100) / 100, MIN_ZOOM, MAX_ZOOM);
      saveReaderSettings({ zoom: reader.zoom, brightness: reader.brightness });
      renderControls();
      hideSelectionBar();
      renderPage();
    }

    function setBrightness(value) {
      reader.brightness = clamp(value, MIN_BRIGHTNESS, 100);
      applyBrightness();
      saveReaderSettings({ zoom: reader.zoom, brightness: reader.brightness });
    }

    /* ----- Event handlers for the Reader ----- */
    function canScrollSideways() {
      // True when the page is zoomed wider than the screen. Then swipes/arrows should scroll, not turn pages.
      return dom.pageScroller.scrollWidth > dom.pageScroller.clientWidth + 1;
    }

    function hasTextSelected() {
      const selection = window.getSelection();
      return Boolean(selection) && !selection.isCollapsed && selection.toString().trim() !== "";
    }

    function handleTouchStart(event) {
      if (event.touches.length !== 1) {
        touchStart = null; // two fingers = pinch-zoom, not a swipe
        return;
      }
      touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
    }

    function handleTouchEnd(event) {
      if (!touchStart) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.x;
      const dy = touch.clientY - touchStart.y;
      touchStart = null;

      if (hasTextSelected() || canScrollSideways()) return;
      // Must be long enough AND mostly sideways, so scrolling down the page never turns it
      if (Math.abs(dx) < SWIPE_MIN_PX || Math.abs(dx) < Math.abs(dy) * 1.5) return;
      changePage(dx < 0 ? 1 : -1); // swipe left = next page, like a paper book
    }

    function handleSelectionChange() {
      clearTimeout(selectionTimer);
      selectionTimer = setTimeout(updateSelectionBar, 120);
    }

    function handleResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (!reader.pdf || state.view !== "reader") return;
        // Phones also "resize" when the address bar hides while scrolling: only redraw if the width really changed
        if (dom.pageScroller.clientWidth !== reader.renderedWidth) renderPage();
      }, 200);
    }

    function handleRecentClick(event) {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const item = button.closest("[data-id]");

      if (button.dataset.action === "pick-book") dom.bookInput.click(); // the browser can't reopen a file by itself
      if (button.dataset.action === "forget-book" && item) forgetBook(item.dataset.id);
    }

    // Returns true if the key was used by the Reader
    function handleReaderKeys(event) {
      if (state.view !== "reader" || !reader.pdf) return false;

      // When zoomed in, the arrow keys scroll sideways (their normal job), so they only turn pages at normal zoom
      const arrowsTurnPages = !canScrollSideways();
      if (event.key === "ArrowLeft" && arrowsTurnPages) {
        event.preventDefault();
        changePage(-1);
        return true;
      }
      if (event.key === "ArrowRight" && arrowsTurnPages) {
        event.preventDefault();
        changePage(1);
        return true;
      }
      if (event.key === "+" || event.key === "=") {
        event.preventDefault();
        setZoom(reader.zoom + ZOOM_STEP);
        return true;
      }
      if (event.key === "-") {
        event.preventDefault();
        setZoom(reader.zoom - ZOOM_STEP);
        return true;
      }
      if (event.key === "0") {
        event.preventDefault();
        setZoom(1);
        return true;
      }
      return false;
    }

    function bindReaderEvents() {
      for (const button of dom.navButtons) {
        button.addEventListener("click", () => showView(button.dataset.view));
      }

      // Opening a book: button, drag and drop
      dom.openBookBtn.addEventListener("click", () => dom.bookInput.click());
      dom.bookInput.addEventListener("change", () => {
        const file = dom.bookInput.files[0];
        dom.bookInput.value = ""; // lets you pick the same file twice in a row
        openBookFile(file);
      });
      dom.dropZone.addEventListener("dragover", (event) => {
        event.preventDefault(); // without this the browser would not allow dropping here
        dom.dropZone.classList.add("is-dragging");
      });
      dom.dropZone.addEventListener("dragleave", () => dom.dropZone.classList.remove("is-dragging"));
      dom.dropZone.addEventListener("drop", (event) => {
        event.preventDefault(); // otherwise the browser would open the PDF in a new tab
        dom.dropZone.classList.remove("is-dragging");
        openBookFile(event.dataTransfer.files[0]);
      });
      dom.recentList.addEventListener("click", handleRecentClick);

      // Reading
      dom.closeBookBtn.addEventListener("click", closeBook);
      dom.viewReader.addEventListener("click", (event) => {
        const stepButton = event.target.closest("[data-page-step]"); // top and bottom buttons share this
        if (stepButton) changePage(Number(stepButton.dataset.pageStep));
      });
      dom.pageInput.addEventListener("change", () => {
        // An emptied (or invalid) number box has the value "", and Number("") is 0: that would jump to page 1.
        const typed = dom.pageInput.value.trim();
        goToPage(typed === "" ? NaN : Number(typed));
      });
      dom.zoomOutBtn.addEventListener("click", () => setZoom(reader.zoom - ZOOM_STEP));
      dom.zoomInBtn.addEventListener("click", () => setZoom(reader.zoom + ZOOM_STEP));
      dom.zoomResetBtn.addEventListener("click", () => setZoom(1));
      dom.brightnessInput.addEventListener("input", () => setBrightness(Number(dom.brightnessInput.value)));
      dom.pageScroller.addEventListener("touchstart", handleTouchStart, { passive: true });
      dom.pageScroller.addEventListener("touchend", handleTouchEnd, { passive: true });
      window.addEventListener("resize", handleResize);

      // Text selection
      dom.pageStage.addEventListener("mousedown", (event) => {
        const layer = event.target.closest(".textLayer");
        if (layer) layer.classList.add("selecting");
      });
      document.addEventListener("mouseup", () => {
        for (const layer of dom.pageStage.querySelectorAll(".textLayer.selecting")) layer.classList.remove("selecting");
      });
      document.addEventListener("selectionchange", handleSelectionChange);
      dom.saveSelectionBtn.addEventListener("click", saveSelectionAsQuote);
    }


    /* =========================================================
       9. EVENT HANDLERS
       ========================================================= */
    function handleFormSubmit(event) {
      event.preventDefault(); // stop the browser from reloading the page
      const values = readForm();
      if (!validateForm(values)) return;

      if (state.editingId) {
        updateQuote(state.editingId, values);
      } else {
        addQuote(values);
        if (state.dialogBookId) finishQuoteFromReader(values); // the quote came from a book page
      }
      closeQuoteDialog();
    }

    // One listener for the whole list ("event delegation"): cards are re-created on every
    // render, so instead of attaching listeners to each button we listen once on the parent
    // and look at which [data-action] element was clicked.
    function handleListClick(event) {
      const button = event.target.closest("[data-action]");
      if (!button) return;

      const card = button.closest("[data-id]");
      const id = card ? card.dataset.id : null;

      switch (button.dataset.action) {
        case "favorite": toggleFavorite(id); break;
        case "copy": copyQuote(id); break;
        case "image": downloadQuoteImage(id); break;
        case "edit": openQuoteDialog(id); break;
        case "delete": deleteQuote(id); break;
        case "filter-tag": {
          const tag = button.dataset.tag;
          setFilter({ tag: state.filters.tag === tag ? "" : tag }); // clicking the active tag turns it off
          break;
        }
        case "add": openQuoteDialog(); break;
        case "clear-filters": clearFilters(); break;
      }
    }

    // When you pick a book you already saved, fill in its author (only if the field is empty)
    function handleBookChange() {
      if (dom.fieldAuthor.value.trim() !== "") return;
      dom.fieldAuthor.value = findAuthorForBook(dom.fieldBook.value);
    }

    function handleImportChosen() {
      const file = dom.importInput.files[0];
      if (file) importQuotes(file);
      dom.importInput.value = ""; // lets you pick the same file twice in a row
    }

    function isTypingInField(target) {
      return target instanceof Element && target.closest("input, textarea, select, [contenteditable]") !== null;
    }

    // Esc is not handled here: the native <dialog> already closes itself on Esc.
    function handleShortcuts(event) {
      if (event.ctrlKey || event.metaKey || event.altKey) return; // leave browser shortcuts alone
      if (dom.dialog.open || isTypingInField(event.target)) return;
      if (handleReaderKeys(event)) return; // arrow keys, +, -, 0 while reading

      // event.code is the physical key, so "N" also works on a Cyrillic keyboard layout
      if (event.code === "KeyN") {
        event.preventDefault();
        openQuoteDialog();
      } else if (event.key === "/") {
        event.preventDefault(); // otherwise Firefox opens its own quick-find
        dom.searchInput.focus();
      }
    }

    function bindEvents() {
      for (const button of dom.themeButtons) {
        button.addEventListener("click", () => setTheme(button.dataset.themeOption));
      }

      dom.addBtn.addEventListener("click", () => openQuoteDialog());
      dom.anotherBtn.addEventListener("click", () => {
        state.dailyQuoteId = pickRandomQuoteId(state.dailyQuoteId);
        renderQuoteOfDay();
      });

      dom.searchInput.addEventListener("input", () => setFilter({ search: dom.searchInput.value }));
      dom.filterBook.addEventListener("change", () => setFilter({ book: dom.filterBook.value }));
      dom.filterTag.addEventListener("change", () => setFilter({ tag: dom.filterTag.value }));
      dom.sortSelect.addEventListener("change", () => setFilter({ sort: dom.sortSelect.value }));
      dom.filterFavorites.addEventListener("change", () => setFilter({ favoritesOnly: dom.filterFavorites.checked }));
      dom.clearFiltersBtn.addEventListener("click", clearFilters);
      dom.list.addEventListener("click", handleListClick);

      dom.form.addEventListener("submit", handleFormSubmit);
      dom.dialogClose.addEventListener("click", closeQuoteDialog);
      dom.dialogCancel.addEventListener("click", closeQuoteDialog);
      dom.dialog.addEventListener("close", () => {
        state.editingId = null;
        state.dialogBookId = null;
      });
      dom.fieldBook.addEventListener("change", handleBookChange);
      dom.fieldText.addEventListener("input", () => setFieldError(dom.fieldText, dom.errorText, ""));
      dom.fieldBook.addEventListener("input", () => setFieldError(dom.fieldBook, dom.errorBook, ""));

      dom.exportBtn.addEventListener("click", exportQuotes);
      dom.importBtn.addEventListener("click", () => dom.importInput.click());
      dom.importInput.addEventListener("change", handleImportChosen);

      document.addEventListener("keydown", handleShortcuts);
      bindReaderEvents();
    }


    /* =========================================================
       10. START
       ========================================================= */
    function init() {
      applyStaticStrings();
      renderShortcuts();

      state.theme = loadTheme();
      renderTheme();

      const { quotes, corrupted } = loadQuotes();
      state.quotes = quotes;
      state.dailyQuoteId = pickRandomQuoteId();

      state.books = loadBooks();
      Object.assign(reader, loadReaderSettings()); // zoom + brightness from last time
      applyBrightness();

      bindEvents();
      renderAll();
      renderView();
      renderReader();

      if (corrupted) showToast(STRINGS.storageCorrupted, { duration: 10000 });
    }

    init();
  </script>
</body>
</html>
